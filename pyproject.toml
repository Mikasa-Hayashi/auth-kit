[project]
name = "auth-kit"
version = "0.1.0"
description = "A reusable FastAPI authentication module with JWT, Google OAuth, rate limiting and brute-force protection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["fastapi", "authentication", "jwt", "oauth", "redis"]
dependencies = [
    "fastapi>=0.100.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.27.0",
    "redis>=4.5.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.0.0",
    "authlib>=1.2.0",
    "itsdangerous>=2.0.0",
    "alembic>=1.10.0",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.23.0",
    "factory-boy>=3.2.0",
    "Faker>=18.0.0",
    "uvicorn>=0.20.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Mikasa-Hayashi/auth-kit"
Repository = "https://github.com/Mikasa-Hayashi/auth-kit"
Issues = "https://github.com/Mikasa-Hayashi/auth-kit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auth_kit"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
